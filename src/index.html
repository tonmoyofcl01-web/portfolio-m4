<!doctype html>
<html class="font-primary">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body class="h-screen overflow-y-auto scroll-smooth text-main-text">
    <!-- Header section -->
    <section class="w-full h-screen flex flex-col bg-background">
      <!-- Navbar -->
      <nav class="container mx-auto">
        <div class="flex items-center justify-between p-5">
          <div class="text-3xl font-bold">
            <i class="fa-solid fa-briefcase"></i> Tonmoy Datta
          </div>
          <div class="flex space-x-4 text-lg">
            <a href="#" class="hover:text-blue-500">Home</a>
            <a href="#" class="hover:text-blue-500">About</a>
            <a href="#" class="hover:text-blue-500">Skills</a>
            <a href="#" class="hover:text-blue-500">Projects</a>
            <a href="#" class="hover:text-blue-500">Contact</a>
          </div>
        </div>
      </nav>
      <!-- Hero -->
      <div class="container mx-auto flex justify-around items-center flex-1 w-[80%]">
        <div class="flex flex-col justify-center gap-10 w-[50%]">
          <div class="flex flex-col gap-2">
            <h1 class="text-5xl font-bold">Tonmoy Datta</h1>
            <p class="text-lg text-secondary-text">MERN Stack Developer</p>
            <p class="text-lg">
              I'm a passionate web developer with a love for creating beautiful
              and functional websites.
            </p>
          </div>
          <div class="flex gap-4">
            <a
              href="#"
              class="px-4 py-2 bg-accent text-background rounded-2xl hover:bg-blue-700"
              >View Projects</a
            >
            <a
              href="#"
              class="px-4 py-2 border border-main-text text-main-text rounded-2xl hover:bg-main-text hover:text-background"
              >Contact Me</a
            >
          </div>
        </div>
        <div class="relative w-60 h-80 rotate-6 bg-[#DEEDF4] rounded-3xl shadow-lg">
          <img
            src="./assets/profile.jpg"
            alt="Tonmoy Datta"
            class=" object-cover rounded-3xl shadow-lg hover:scale-105 transition-transform duration-300 absolute top-0 right-0 -rotate-6"
          />
        </div>
      </div>
    </section>
    <!-- About Me section -->
    <section class="w-full h-screen bg-blue-400"></section>
    <!-- Skills section -->
    <section class="w-full h-screen bg-green-400"></section>
    <!-- Projects section -->
    <section class="w-full h-screen bg-pink-400"></section>
    <!-- Education section -->
    <section class="w-full h-screen bg-yellow-400"></section>
    <!-- Contact section -->
    <section class="w-full h-screen bg-purple-400"></section>
    <!-- footer section -->
    <section class="w-full h-screen bg-gray-400"></section>

    <!-- font awesome -->
    <script
      src="https://kit.fontawesome.com/fb6788d0b7.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
